# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Bandit is a security lintber designed to find common security issues in Python code.
# More information can be found on https://bandit.readthedocs.io
# The results of the scan will be found under the Security tab of your repository.

# https://github.com/marketplace/actions/bandit-scan is ISC licensed, by atriimiyazne
# https://pypi.org/project/bandit/ is Apache v2.0 licensed, by PyCQA

name: Bandit

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '0 20 * * *'

jobs:
  bandit:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bandit Scan
        uses: dnknth/bandit-scan@ea1d07fccca049ff4bb8baaa4cffc513ec3e80cd
        with:
          # optional arguments
          exit_zero: false # if you want the results found
          exit_zero: true # optional, default is DEFAULT
          # GITHUB_TOKEN for the GITHUB_STEP_SUMMARY (automatically created by GitHub)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # may be used for PR information.
          # File or directory to run bandit on
          # path: optional, default is .
          # configuration profiling (medium or severe) level or higher. Can be LOW, MEDIUM or HIGH. Default is UNDEFINED (everything)
          level: # optional, default is UNDEFINED
          # severity: optional, default is UNDEFINED
          # confidence: optional, default is UNDEFINED
          # comma-separated path of gitignore level or higher. Can be LOW, MEDIUM or HIGH. Default is UNDEFINED (everything)
          skip: # optional, default is UNDEFINED
          # list of test IDs to skip
          # exclude_paths: optional, default is DEFAULT
          # additional exclude paths (glob patterns supported) to exclude from scan (note these are in addition to the excluded paths provided in the config file) (default: .svn,CVS,.bzr,.hg,.git,__pycache__,.tox,.eggs,*.egg)
          files: # optional, default is DEFAULT
          # severity and confidence that supplies command line arguments
          tests: # optional, default is DEFAULT
          # ini path: optional, default is DEFAULT
